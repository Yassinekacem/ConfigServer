eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:4040/eureka

spring:
  cloud:
    gateway:

      # ✅ CORS pour autoriser Next.js (localhost:3000) à appeler le Gateway (localhost:5000)
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      routes:
        - id: MSExploitations
          uri: lb://MSExploitations
          predicates:
            - Path=/exploitations/**
          filters:
            # version "robuste" (slash optionnel) recommandée dans la doc
            - RewritePath=/exploitations/?(?<lien>.*), /${lien}

        - id: MSSupervision
          uri: lb://MSSupervision
          predicates:
            - Path=/supervision/**
          filters:
            - RewritePath=/supervision/?(?<lien>.*), /${lien}

        - id: MSNotification
          uri: lb://MSNotification
          predicates:
            - Path=/notification/**
          filters:
            - RewritePath=/notification/?(?<lien>.*), /${lien}

management:
  endpoints:
    web:
      exposure:
        include: gateway
  endpoint:
    gateway:
      access: read-only
