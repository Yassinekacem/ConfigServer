# ===============================
# =        APP / PORT           =
# ===============================
spring.application.name=MSNotification
server.port=9097

# ===============================
# =           KAFKA             =
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

# Consumer group (doit être stable)
spring.kafka.consumer.group-id=ms-notification-group

# Pour relire les messages au 1er lancement du groupe
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# IMPORTANT: autoriser la classe (sinon "not in trusted packages")
spring.kafka.consumer.properties.spring.json.trusted.packages=tn.itbs.tp.kafka

# IMPORTANT: type par défaut si pas de type headers dans le message
spring.kafka.consumer.properties.spring.json.value.default.type=tn.itbs.tp.kafka.AlerteEvent

# (Optionnel) si tu veux ignorer complètement les type headers
#spring.kafka.consumer.properties.spring.json.use.type.headers=false


# ===============================
# =           DATABASE          =
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/MSNotification?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# ===============================
# =           JPA / HIBERNATE   =
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# =           EUREKA CLIENT     =
# ===============================
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=http://localhost:4040/eureka

# ===============================
# =           ACTUATOR          =
# ===============================
management.endpoints.web.exposure.include=refresh
