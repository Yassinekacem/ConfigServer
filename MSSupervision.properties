spring.application.name=MSSupervision
server.port=9095

# ===============================
# =           KAFKA             =
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===============================
# =           DATABASE          =
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/MSSupervision?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# ===============================
# =           JPA / HIBERNATE   =
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# =           EUREKA CLIENT     =
# ===============================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:4040/eureka

# ===============================
# =           ACTUATOR          =
# ===============================
management.endpoints.web.exposure.include=refresh
